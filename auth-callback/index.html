<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科大账号登录</title>
  <style>
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3eee4;
      color: #241c16;
    }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem; }
    code { word-break: break-all; }
    .label { color: #6d645b; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <p id="status">正在回到小程序…</p>
    <div id="manual" hidden>
      <p>没有自动回到小程序时，把下面两项填回登录页。</p>
      <p class="label">code</p>
      <p><code id="code"></code></p>
      <p class="label">state</p>
      <p><code id="state"></code></p>
    </div>
  </main>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"></script>
  <script>
    var params = new URLSearchParams(location.search)
    var code = params.get('code') || ''
    var state = params.get('state') || ''
    document.getElementById('code').textContent = code
    document.getElementById('state').textContent = state
    var target = '/pages/login/login?oauthCode=' + encodeURIComponent(code) + '&oauthState=' + encodeURIComponent(state)
    function showManual() {
      document.getElementById('status').textContent = '请把 code 和 state 填回小程序。'
      document.getElementById('manual').hidden = false
    }
    if (!code || !state) {
      document.getElementById('status').textContent = '回调里没有 code 或 state。'
      showManual()
    } else if (window.wx && wx.miniProgram && wx.miniProgram.redirectTo) {
      wx.miniProgram.redirectTo({ url: target, fail: showManual })
      setTimeout(showManual, 1200)
    } else {
      showManual()
    }
  </script>
</body>
</html>
